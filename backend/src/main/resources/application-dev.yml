spring:
  datasource:
    url: ${GEC_DB_URL:jdbc:postgresql://localhost:5432/gec_db}
    username: ${GEC_DB_USERNAME:gec_user}
    password: ${GEC_DB_PASSWORD:gec_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-before-migrate: true