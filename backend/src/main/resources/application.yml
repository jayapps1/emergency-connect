server:
  port: ${GEC_SERVER_PORT:8099}

spring:
  application:
    name: gec-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${GEC_DB_URL:jdbc:postgresql://localhost:5432/gec_db}
    username: ${GEC_DB_USERNAME:gec_user}
    password: ${GEC_DB_PASSWORD:gec_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-before-migrate: true

gec:
  bootstrap:
    admin:
      email: ${GEC_BOOTSTRAP_ADMIN_EMAIL:nanagyachie@gmail.com}
      password: ${GEC_BOOTSTRAP_ADMIN_PASSWORD:}
      first-name: ${GEC_BOOTSTRAP_ADMIN_FIRST_NAME:Nana}
      last-name: ${GEC_BOOTSTRAP_ADMIN_LAST_NAME:Gyachie}

  admin:
    allowed-origins: ${GEC_ADMIN_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  jwt:
    secret: ${GEC_JWT_SECRET:defaultSecretKeyForDevelopmentMustBeAtLeast32BytesLongForHS256!}
    expiration-ms: ${GEC_JWT_EXPIRATION_MS:900000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized
